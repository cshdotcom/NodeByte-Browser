name: Build-NodeByte-Server-Image

# All-in-One 服务端镜像：构建 → 发布 ghcr.io
#   main 推送    → ghcr.io/cshdotcom/nodebyte-server:main
#   tag v1.2.0   → ghcr.io/cshdotcom/nodebyte-server:1.2.0 / 1.2 / latest
#   PR           → 仅构建验证，不发布
# 双架构：linux/amd64 + linux/arm64（QEMU 构建，纯 JS 依赖无交叉编译）

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nodebyte-server

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Published ${{ env.IMAGE }} → ${{ steps.meta.outputs.tags }}"
