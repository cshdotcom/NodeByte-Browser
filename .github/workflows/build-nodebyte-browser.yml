name: Build-NodeByte-Browser

# NodeByte Browser —— GitHub 托管 Runner 云端直编（无需自托管构建机）
#
# 编译流程（与 docs/build-client.md 一致）：
#   1. 官方 depot_tools fetch --no-history chromium（正式 stable 版，版本号动态取自
#      Google versionhistory API：https://versionhistory.googleapis.com）
#   2. 应用 NodeByte 补丁集（client/patches/0100+ 新增文件补丁强制应用；
#      0200+ 核心 hook 补丁在基线漂移时按 best-effort 处理并告警）
#   3. gn gen + autoninja 编译（托管优化参数：symbol_level=0、无 ThinLTO/PGO）
#   4. 打包 standalone 成品（Linux tar / Windows 便携 zip + Inno Setup 安装包 / Android APK）
#   5. tag 推送触发时，自动把成品上传到对应 GitHub Release
#
# 平台矩阵：Linux x64（ubuntu-22.04）/ Windows x64（windows-2022）/ Android arm64（ubuntu-22.04）
# 托管 Runner 限制应对：释放磁盘约 50GB、no-history 源码、关闭符号与 LTO、单 job 355 分钟上限；
# Windows 编译最接近超时上限，continue-on-error 保证 Linux/Android 产物不受阻塞。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode'
        required: true
        default: release
        type: choice
        options: [release, dev]
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-browser-${{ github.ref }}
  cancel-in-progress: false

env:
  # versionhistory API 不可用时的保底正式版
  CHROMIUM_BASELINE_FALLBACK: '140.0.7339.80'

jobs:
  # ---------- 解析官方最新 stable 版本号 ----------
  resolve-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          V=$(curl -sf --max-time 30 \
              "https://versionhistory.googleapis.com/v1/chrome/platforms/linux/channels/stable/versions" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['versions'][0]['version'])" \
              || echo "${CHROMIUM_BASELINE_FALLBACK}")
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Chromium official stable baseline = ${V}"

  # ---------- Linux x64 ----------
  build-linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      CHROMIUM_DIR: /home/runner/chromium
      CHROMIUM_BASELINE: ${{ needs.resolve-version.outputs.version }}
      DEPOT_TOOLS_DIR: /home/runner/depot_tools
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (~50GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          codeql: true
          docker-images: true
          large-packages: true
          swap-storage: false     # 保留 swap，链接阶段需要

      - name: Show resources
        run: echo "CPU $(nproc) | MEM $(free -g | awk '/Mem/{print $2}')G | DISK $(df -h /home | tail -1 | awk '{print $4}') free"

      - name: Fetch official Chromium source
        run: bash client/scripts/sync_chromium.sh
        env:
          GCLIENT_JOBS: '8'

      - name: Apply NodeByte patches
        run: bash client/scripts/apply_patches.sh "${CHROMIUM_DIR}/src"
        env:
          PATCH_BEST_EFFORT: '1'

      - name: Build chrome (Linux x64)
        run: bash client/scripts/build_pc.sh "${CHROMIUM_DIR}/src"
        env:
          ARGS_FILE: ${{ github.workspace }}/client/gn/args-hosted-pc.gn
          OUT_SUFFIX: hosted-pc

      - name: Package standalone
        run: bash client/scripts/package_linux.sh "${CHROMIUM_DIR}/src" "${CHROMIUM_BASELINE}"
        env:
          OUT_SUFFIX: hosted-pc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodebyte-linux-x64
          path: ${{ env.CHROMIUM_DIR }}/src/out/Release-hosted-pc/_dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------- Windows x64 ----------
  build-windows:
    needs: resolve-version
    runs-on: windows-2022
    continue-on-error: true   # 最贴近 6h 上限：超时不阻塞 Linux/Android 产物发布
    timeout-minutes: 355
    env:
      CHROMIUM_DIR_WIN: 'C:\chromium'
      CHROMIUM_DIR: /c/chromium
      CHROMIUM_BASELINE: ${{ needs.resolve-version.outputs.version }}
      DEPOT_TOOLS_DIR: /c/depot_tools
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'   # 使用 runner 本地 VS2022 工具链
      GYP_MSVS_VERSION: '2022'
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: |
          $dirs = @(
            'C:\Program Files (x86)\Android\android-sdk',
            'C:\ProgramData\DockerDesktop', 'C:\ProgramData\MySQL', 'C:\ProgramData\PostgreSQL',
            'C:\ProgramData\MongoDB', 'C:\Program Files\MongoDB', 'C:\Program Files\MySQL',
            'C:\Program Files\PostgreSQL', 'C:\Program Files\dotnet', 'C:\hostedtoolcache\windows\dotnet'
          )
          foreach ($d in $dirs) { if (Test-Path $d) { Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue } }
          docker rmi $(docker images -q) 2>$null | Out-Null
          "Freed. Free space:"; (Get-PSDrive C).Free / 1GB

      - name: Install depot_tools
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf input
          [ -d /c/depot_tools/.git ] || git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /c/depot_tools
          echo "/c/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch official Chromium source
        shell: bash
        run: bash client/scripts/sync_chromium.sh
        env:
          GCLIENT_JOBS: '8'

      - name: Apply NodeByte patches
        shell: bash
        run: bash client/scripts/apply_patches.sh "${CHROMIUM_DIR}/src"
        env:
          PATCH_BEST_EFFORT: '1'

      - name: Build chrome.exe (Windows x64)
        shell: bash
        run: bash client/scripts/build_pc.sh "${CHROMIUM_DIR}/src"
        env:
          ARGS_FILE: ${{ github.workspace }}\client\gn\args-hosted-win.gn
          OUT_SUFFIX: hosted-pc

      - name: Package portable zip + Inno Setup installer
        shell: bash
        run: |
          bash client/scripts/package_windows.sh "${CHROMIUM_DIR}/src" "${CHROMIUM_BASELINE}" || true
          STAGING="/c/chromium/src/out/Release-hosted-pc/_staging"
          if [ -f "$STAGING/nodebyte.exe" ]; then
            mkdir -p "/c/chromium/src/out/Release-hosted-pc/_dist"
            VERSION="${CHROMIUM_BASELINE}"
            (cd "$STAGING" && 7z a -tzip "/c/chromium/src/out/Release-hosted-pc/_dist/NodeByte-Browser-${VERSION}-windows-x64-portable.zip" .) || true
          fi
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ -x "$ISCC" ] && [ -f client/installer/NodeByteBrowser.iss ]; then
            cd client/installer
            "$ISCC" NodeByteBrowser.iss || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodebyte-windows-x64
          path: |
            C:\chromium\src\out\Release-hosted-pc\_dist\*
            C:\chromium\src\out\Release-hosted-pc\Output\*
          if-no-files-found: warn
          retention-days: 30

  # ---------- Android arm64 ----------
  build-android:
    needs: resolve-version
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      CHROMIUM_DIR: /home/runner/chromium
      CHROMIUM_BASELINE: ${{ needs.resolve-version.outputs.version }}
      DEPOT_TOOLS_DIR: /home/runner/depot_tools
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (~50GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true          # 释放预装 SDK；Chromium hooks 会自动下载自带的 SDK/NDK
          dotnet: true
          haskell: true
          codeql: true
          docker-images: true
          large-packages: true
          swap-storage: false

      - name: Install depot_tools
        run: |
          [ -d "${DEPOT_TOOLS_DIR}/.git" ] || git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git "${DEPOT_TOOLS_DIR}"
        env:
          DEPOT_TOOLS_DIR: /home/runner/depot_tools

      - name: Fetch official Chromium source (android target)
        run: bash client/scripts/sync_chromium.sh
        env:
          GCLIENT_JOBS: '8'
          TARGET_OS: 'android'

      - name: Apply NodeByte patches
        run: bash client/scripts/apply_patches.sh "${CHROMIUM_DIR}/src"
        env:
          PATCH_BEST_EFFORT: '1'

      - name: Build APK (Android arm64)
        run: bash client/scripts/build_android.sh "${CHROMIUM_DIR}/src"
        env:
          ARGS_FILE: ${{ github.workspace }}/client/gn/args-hosted-android.gn
          OUT_SUFFIX: hosted-android

      - name: Collect APKs
        run: |
          mkdir -p "${CHROMIUM_DIR}/src/out/Release-hosted-android/_dist"
          cp -f "${CHROMIUM_DIR}/src/out/Release-hosted-android/apks/"*.apk \
                "${CHROMIUM_DIR}/src/out/Release-hosted-android/_dist/" 2>/dev/null || true
          ls -la "${CHROMIUM_DIR}/src/out/Release-hosted-android/_dist/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodebyte-android-arm64
          path: ${{ env.CHROMIUM_DIR }}/src/out/Release-hosted-android/_dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------- tag 触发：成品上传 Release ----------
  publish-release:
    needs: [resolve-version, build-linux, build-windows, build-android]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la dist/ || true
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "NodeByte Browser ${GITHUB_REF_NAME}" \
              --notes "自动编译产物（更新记录见 CHANGELOG.md 对应条目）"
          fi
          shopt -s nullglob
          for f in dist/*; do
            [ -f "$f" ] || continue
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber --repo "$GITHUB_REPOSITORY" \
              && echo "uploaded: $(basename "$f")"
          done
