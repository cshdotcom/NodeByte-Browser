# NodeByte Server 一键部署：PostgreSQL + MinIO + WS 信令 + Next.js standalone
# 用法：
#   cp .env.example .env && 修改密钥
#   docker compose up -d
#   docker compose exec server node scripts/bootstrap.mjs   # 初始化管理员
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodebyte
      POSTGRES_PASSWORD: nodebyte
      POSTGRES_DB: nodebyte
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodebyte"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 七个业务桶自动初始化（drop-files/screenshots/sync-blobs/extension-pool/doc-snapshots/recordings/avatars）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set nb http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      for b in drop-files screenshots sync-blobs extension-pool doc-snapshots recordings avatars; do
        mc mb --ignore-existing nb/$$b;
      done;
      echo 'buckets ready';
      "

  ws-service:
    build:
      context: ./ws-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WS_PORT: 8081
      DATABASE_URL: postgres://nodebyte:nodebyte@postgres:5432/nodebyte
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-value}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-me-internal-secret}
    ports:
      - "8081:8081"
      - "8181:8181"
    depends_on:
      postgres: { condition: service_healthy }

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nodebyte:nodebyte@postgres:5432/nodebyte
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-value}
      INTERNAL_SHARED_SECRET: ${INTERNAL_SHARED_SECRET:-change-me-internal-secret}
      WS_SERVICE_URL: http://ws-service:8081
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DEFAULT_SYNC_DOMAIN: ${DEFAULT_SYNC_DOMAIN:-bsync.nodebyte.cn}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nodebyte.cn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      ws-service: { condition: service_started }

volumes:
  pgdata:
  miniodata:
