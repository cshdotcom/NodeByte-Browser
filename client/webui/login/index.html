<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeByte Browser · 登录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="logo"><svg viewBox="0 0 512 512" width="18" height="18" aria-hidden="true"><defs><linearGradient id="nbT" x1="0" y1="0.95" x2="0.9" y2="0.05"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.48" stop-color="#4F7DFF"/><stop offset="1" stop-color="#A855F7"/></linearGradient></defs><path d="M138 412 L138 112 L374 402 L374 104" fill="none" stroke="url(#nbT)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 412 L138 112 L374 402 L374 104" fill="none" stroke="#F2FAFF" stroke-width="18" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="138" cy="112" r="30" fill="url(#nbT)"/><circle cx="138" cy="112" r="12" fill="#fff"/><circle cx="374" cy="402" r="30" fill="url(#nbT)"/><circle cx="374" cy="402" r="12" fill="#fff"/><circle cx="374" cy="104" r="30" fill="url(#nbT)"/><circle cx="374" cy="104" r="12" fill="#fff"/><circle cx="443" cy="59" r="26" fill="url(#nbT)" opacity="0.8"/><circle cx="443" cy="59" r="11" fill="#FDF7FF"/></svg></span> NodeByte Browser</div>
    <h1 data-i18n="title">登录 NodeByte 账号</h1>
    <p class="sub" data-i18n="sub">同步 · DROP · 协作 · 多设备互通</p>

    <form id="loginForm">
      <div class="f"><label data-i18n="account">账号</label>
        <input id="identifier" type="text" autocomplete="username" placeholder="you@example.com" required></div>
      <div class="f"><label data-i18n="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required></div>
      <div class="f" id="totpRow" hidden><label data-i18n="totp">两步验证码</label>
        <input id="totpCode" inputmode="numeric" maxlength="6" placeholder="123456"></div>
      <button class="btn primary" type="submit" id="btnLogin" data-i18n="login">登 录</button>
    </form>

    <div class="links">
      <a href="#" id="forgotLink" data-i18n="forgot">忘记密码</a>
      <span id="serverAddr">bsync.nodebyte.cn</span>
    </div>
    <p class="notice" id="msg" hidden></p>
    <p class="foot">Based on Chromium open-source project</p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
