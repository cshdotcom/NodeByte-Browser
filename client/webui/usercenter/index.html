<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodeByte 个人中心</title>
<style>
:root {
  --bg:#f6f7f9; --card:#fff; --border:#e4e7ec; --text:#1a1d23; --dim:#6b7280;
  --primary:#2f6bff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#14161b; --card:#1b1e26; --border:#2a2f3a; --text:#e8eaf0; --dim:#9aa3b2; --primary:#5b8bff; }
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.card {
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:30px; max-width:460px; width:100%; text-align:center;
}
h1 { font-size:18px; margin:14px 0 8px; }
p { font-size:12.5px; color:var(--dim); line-height:1.8; margin-bottom:18px; }
.btn {
  display:inline-block; padding:10px 22px; border-radius:9px; border:none;
  background:var(--primary); color:#fff; font-size:13.5px; cursor:pointer;
  text-decoration:none; font-weight:600;
}
.hint { margin-top:14px; font-size:11px; color:var(--dim); }
#url { word-break:break-all; color:var(--primary); }
</style>
</head>
<body>
<div class="card">
  <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M8 30 C 12 12, 36 12, 40 30" stroke="#2f6bff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="14" cy="22" r="2.4" fill="#2f6bff"/>
    <circle cx="24" cy="16" r="2.4" fill="#5b8bff"/>
    <circle cx="34" cy="22" r="2.4" fill="#2f6bff"/>
  </svg>
  <h1>NodeByte 个人中心</h1>
  <p>账号资料、设备管理、两步验证绑定与配额信息在网页版个人中心完成。
     点击下方按钮在新标签页打开。</p>
  <a class="btn" id="go" href="#" rel="noopener">打开网页版个人中心</a>
  <p class="hint">目标地址（跟随同步服务器配置）：<span id="url">检测中…</span></p>
</div>
<script>
// 允许 nodebyte://usercenter?server=<base> 显式指定，或由设置页传入
const q = new URLSearchParams(location.search);
const server = q.get('server') || (window.__NODEBYTE__ && window.__NODEBYTE__.syncServer) || '';
const target = (server || 'https://account.nodebyte.cn') + '/usercenter';
document.getElementById('go').href = target;
document.getElementById('url').textContent = target;
</script>
</body>
</html>
