; NodeByte All-in-One 进程编排
; 顺序 priority：postgres(10) → minio(20) → 桶初始化(30, 一次性) → ws(40) → web(50) → nginx(90)
; 全部服务仅监听 127.0.0.1，唯一对外入口为 nginx :8080

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=/usr/bin/env bash -c 'exec $(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c max_connections=200'
user=postgres
priority=10
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /data/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
priority=20
startsecs=5
stopasgroup=true
killasgroup=true
; MINIO_ROOT_USER / MINIO_ROOT_PASSWORD 由 entrypoint export，此处直接继承
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bucket-init]
command=/usr/local/bin/node /app/tools/ensure-buckets.mjs
priority=30
autostart=true
autorestart=false
startretries=20
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ws]
command=/usr/local/bin/node /app/ws/index.mjs
directory=/app/ws
priority=40
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /app/web/server.js
directory=/app/web
priority=50
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=90
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
