# NodeByte All-in-One —— 唯一对外入口 :8080
# 路由：/healthz 健康检查；七个 S3 桶 → MinIO（预签名直传/直下）；
#       /ws → WebSocket 信令升级；其余 → Next.js Web（前台/后台/个人中心/API）

server {
    listen 8080 default_server;
    server_name _;

    # Drop 大文件 / 同步 blobs
    client_max_body_size 2048m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # 桶名直出：presigned URL（host:8080/bucket/key?X-Amz-...）经此反代到内嵌 MinIO。
    # 必须保留原始 Host 头 —— SigV4 签名包含 Host，改写将导致 SignatureDoesNotMatch。
    location ~ ^/(drop-files|screenshots|sync-blobs|extension-pool|doc-snapshots|recordings|avatars)/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;   # 大文件流式转发
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 客户端 WebSocket 信令（wss?://host/ws → 附录D 协议）
    location = /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 服务间内部事件接口：仅容器内可调用
    location = /internal/emit {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
